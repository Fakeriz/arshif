name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check main JS files
        run: |
          node --check "app/api/[[...path]]/route.js"
          node --check app/share/route.js
          node --check lib/supabase.js
          node --check next.config.js

      - name: Run tests
        run: npm test

      # next build mengevaluasi route API saat mengumpulkan page data, dan
      # lib/supabase.js menolak jalan tanpa env. Nilai di bawah hanya placeholder
      # untuk build: tidak ada koneksi Supabase sungguhan yang terjadi.
      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build
